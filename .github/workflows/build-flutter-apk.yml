name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'gp-service-mobile-*'
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GP_API_URL: ${{ vars.GP_API_URL }}
  GP_API_FALLBACK_URL: ${{ vars.GP_API_FALLBACK_URL }}

jobs:
  build-apk:
    name: Build ${{ matrix.app_name }} test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: gp-service
            app_dir: apps/flutter/gp_service_app
            project_name: service
            package_id: kz.gp.service
            artifact_name: gp-service-test-apk
            apk_name: gp-service-test.apk
          - app_name: gp-partner
            app_dir: apps/flutter/gp_partner_app
            project_name: partner
            package_id: kz.gp.partner
            artifact_name: gp-partner-test-apk
            apk_name: gp-partner-test.apk

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Generate Android project
        shell: bash
        run: |
          cd "${{ matrix.app_dir }}"
          flutter create --platforms android --project-name "${{ matrix.project_name }}" --org kz.gp .
          rm -rf test
          echo "[apk] Android project generated"

      - name: Set Android package id
        shell: bash
        run: |
          cd "${{ matrix.app_dir }}"
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "${{ matrix.package_id }}"/' android/app/build.gradle.kts
            sed -i 's/namespace = "[^"]*"/namespace = "${{ matrix.package_id }}"/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "${{ matrix.package_id }}"/' android/app/build.gradle
            sed -i 's/namespace "[^"]*"/namespace "${{ matrix.package_id }}"/' android/app/build.gradle
          fi
          echo "[apk] Android package id configured as ${{ matrix.package_id }}"

      - name: Install dependencies
        run: |
          cd "${{ matrix.app_dir }}"
          flutter pub get

      - name: Analyze Flutter app
        run: |
          cd "${{ matrix.app_dir }}"
          flutter analyze

      - name: Build test APK
        id: build_apk
        shell: bash
        run: |
          set +e
          cd "${{ matrix.app_dir }}"
          API_URL="${GP_API_URL:-https://apigp.duckdns.org/api}"
          mkdir -p ../../../apk-artifacts
          flutter build apk --debug \
            --dart-define=API_URL="$API_URL" \
            --dart-define=API_FALLBACK_URL="${GP_API_FALLBACK_URL:-}" \
            --dart-define=GP_DEV_OTP=true 2>&1 | tee "../../../apk-artifacts/${{ matrix.app_name }}-build.log"
          status="${PIPESTATUS[0]}"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk "../../../apk-artifacts/${{ matrix.apk_name }}"
            ls -lh "../../../apk-artifacts/${{ matrix.apk_name }}"
          else
            tail -n 80 "../../../apk-artifacts/${{ matrix.app_name }}-build.log" > "../../../apk-artifacts/${{ matrix.app_name }}-build-tail.log"
            {
              echo "APK build failed for ${{ matrix.app_name }}. Last log lines:"
              cat "../../../apk-artifacts/${{ matrix.app_name }}-build-tail.log"
            } | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=APK build failed::/'
          fi
          exit 0

      - name: Verify test APK package and signature
        if: steps.build_apk.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk="apk-artifacts/${{ matrix.apk_name }}"
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/apk-badging.txt
          grep "package: name='${{ matrix.package_id }}'" /tmp/apk-badging.txt
          echo "[apk] ${apk} is signed and has package ${{ matrix.package_id }}"

      - name: Enable Android emulator acceleration
        if: steps.build_apk.outputs.status == '0'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify test APK installs on Android emulator
        if: steps.build_apk.outputs.status == '0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r "apk-artifacts/${{ matrix.apk_name }}"
            adb shell pm list packages | grep "${{ matrix.package_id }}"
            adb uninstall "${{ matrix.package_id }}"
            echo "[apk] ${{ matrix.apk_name }} installed and uninstalled successfully"

      - name: Upload APK artifact
        if: steps.build_apk.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apk-artifacts/${{ matrix.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_name }}-apk-build-log
          path: |
            apk-artifacts/${{ matrix.app_name }}-build.log
            apk-artifacts/${{ matrix.app_name }}-build-tail.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when APK build failed
        if: steps.build_apk.outputs.status != '0'
        run: exit 1
