# Production stack: PostgreSQL + GP API + 3 frontend apps
# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file apps/api/.env.production up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: gp-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gp_service}
    volumes:
      - gp_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gp}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gp-net

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: gp-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gp_service}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://gp-service.kz,https://partner.gp-service.kz,https://admin.gp-service.kz,https://market.gp-service.kz,https://admingp.duckdns.org,https://servicegp.duckdns.org,https://partnergp.duckdns.org}
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-https://wp.gpartners.kz/queues/push}
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:-}
      OTP_STORE_REVIEW_PHONE: ${OTP_STORE_REVIEW_PHONE:-}
      OTP_STORE_REVIEW_CODE: ${OTP_STORE_REVIEW_CODE:-}
      OTP_DEV_BYPASS_ENABLED: ${OTP_DEV_BYPASS_ENABLED:-false}
      OTP_DEV_BYPASS_CODE: ${OTP_DEV_BYPASS_CODE:-777777}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      UPLOAD_DIR: /app/uploads
    ports:
      - '127.0.0.1:${GP_API_PORT:-4000}:4000'
    volumes:
      - gp_uploads_prod:/app/uploads
    networks:
      - gp-net

  gp-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        GP_APP: service
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
        VITE_APP_NAME: service
    container_name: gp-service-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GP_SERVICE_PORT:-5173}:80'
    networks:
      - gp-net

  gp-partner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        GP_APP: partner
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
        VITE_APP_NAME: partner
    container_name: gp-partner-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GP_PARTNER_PORT:-5174}:80'
    networks:
      - gp-net

  gp-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        GP_APP: admin
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
        VITE_APP_NAME: admin
    container_name: gp-admin-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GP_ADMIN_PORT:-5175}:80'
    networks:
      - gp-net

volumes:
  gp_pg_prod:
  gp_uploads_prod:

networks:
  gp-net:
    driver: bridge
